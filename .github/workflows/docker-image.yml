name: Build and publish Docker image

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: elias288/seguimiento-multimedia

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check package version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./src/package.json').version")
          PREVIOUS_VERSION=$(git show HEAD^:src/package.json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version))")

          echo "Previous version: $PREVIOUS_VERSION"
          echo "Current version:  $CURRENT_VERSION"

          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "Version has not changed. Skipping Docker build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version changed. Docker image will be built."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./ContainerFile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
